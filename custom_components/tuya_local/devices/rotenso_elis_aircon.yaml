name: Rotenso Elis Air Conditioner
products:
  - id: nn2ooaacswz6uyi0
    name: Rotenso Elis

entities:
  - entity: climate
    dps:
      # switch (DP1) i mode (DP4) połączone w jedną encję hvac_mode,
      # zgodnie z udokumentowanym wzorcem tuya-local dla urządzeń
      # z osobnym power switch i osobnym mode enum.
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: "0"
                value: auto
              - dps_val: "1"
                value: cool
              - dps_val: "2"
                value: dry
              - dps_val: "3"
                value: fan_only
              - dps_val: "4"
                value: heat
      # DP pomocniczy używany tylko przez constraint powyżej — nie tworzy
      # osobnej widocznej encji
      - id: 4
        type: string
        name: mode
        hidden: true
        
      # Zadana temperatura (Tuya zwraca w °C x100, np. 2600 = 26.0°C)
      - id: 2
        type: integer
        name: temperature
        range:
          min: 1600
          max: 3100
        mapping:
          - scale: 100
            step: 50

      # Aktualna temperatura odczytana (°C x100)
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - scale: 100
          
      # Prędkość wentylatora
      - id: 5
        type: string
        name: fan_mode
        mapping:
          - dps_val: "0"
            value: Auto
          - dps_val: "1"
            value: Cicho
          - dps_val: "2"
            value: Słabo
          - dps_val: "3"
            value: Średnio-słabo
          - dps_val: "4"
            value: Średnio
          - dps_val: "5"
            value: Średnio-mocno
          - dps_val: "6"
            value: Mocno
          - dps_val: "7"
            value: Turbo

  - entity: switch
    name: ECO
    icon: mdi:leaf
    dps:
      - id: 8
        type: boolean
        name: switch
        
  - entity: switch
    name: Osuszanie
    icon: mdi:air-purifier
    dps:
      - id: 9
        type: boolean
        name: switch

#  - entity: switch
#    name: Heat (tryb dodatkowy)
#    icon: mdi:radiator
#    dps:
#      - id: 12
#        type: boolean
#        name: switch

  - entity: switch
    name: Podświetlenie
    icon: mdi:lightbulb
    dps:
      - id: 13
        type: boolean
        name: switch
  - entity: switch
    name: Dźwięk potwierdzenia
    icon: mdi:volume-high
