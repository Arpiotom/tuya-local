      - id: 26
        type: boolean
        name: switch

  - entity: switch
    name: Samoczyszczenie
    icon: mdi:spray-bottle
    dps:
      - id: 27
        type: boolean
        name: switch       
       
  # Kierunek nawiewu pionowy (gear_vertical, DP 31, zakres 0-13)
